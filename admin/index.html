    });
  } catch (e) { }
}
function subscribe() {
  channel = db.channel('leads-live')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'leads' }, ({ new: l }) => {
      if (leads.some(x => x.id === l.id)) return;
      leads.unshift(l); renderFilters(); renderList();
      beep(); toast('Novi zahtev: ' + (l.ime || ''));
      if ('Notification' in window && Notification.permission === 'granted') {
        try { new Notification('Novi zahtev – Plavi Slon', { body: `${l.ime || ''} · ${l.telefon || ''} · ${money(l.ukupna_cena)}`, icon: '/assets/ikona-192.png' }); } catch (e) { }
      }
    })
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'leads' }, ({ old }) => {
      leads = leads.filter(x => x.id !== old.id); renderFilters(); renderList();
    })
    .subscribe();
}
$('#notifyBtn').addEventListener('click', async () => {
  if (!('Notification' in window)) { toast('Ovaj pregledač ne podržava obaveštenja.'); return; }
  const p = await Notification.requestPermission();
  toast(p === 'granted' ? 'Obaveštenja su uključena na ovom uređaju.' : 'Obaveštenja nisu dozvoljena.');
  beep();
});
function mergeRules(src) {
  const r = clone(DEFAULT_RULES);
  if (!src || typeof src !== 'object') return r;
  Object.keys(r).forEach(k => {
    const v = src[k];
    if (v == null) return;
    if (Array.isArray(r[k])) { if (Array.isArray(v) && v.length === r[k].length) r[k] = v.map(Number); }
    else if (typeof r[k] === 'object') Object.keys(r[k]).forEach(s => { if (Array.isArray(v[s]) && v[s].length === 2) r[k][s] = v[s].map(Number); });
    else if (Number.isFinite(Number(v))) r[k] = Number(v);
  });
  return r;
}
async function loadConfig() {
  const { data, error } = await db.from('config').select('*').order('id', { ascending: true }).limit(1);
  if (error) { toast('Cene nisu učitane: ' + error.message); return; }
  configRow = data && data[0] || null;
  let p = configRow && configRow.pravila;
  if (typeof p === 'string') { try { p = JSON.parse(p); } catch (e) { p = null; } }
  rules = mergeRules(p);
  renderPrices();
}
const inp = (path, val, step) => `<input class="num" type="number" min="0" step="${step || 'any'}" data-path="${path}" value="${val}">`;
function card(title, inner, note) {
  return `<section class="glass p-5 sm:p-6"><h3 class="font-display text-lg font-bold text-white">${title}</h3>${note ? `<p class="text-xs text-slate-500 mt-1">${note}</p>` : ''}<div class="mt-4">${inner}</div></section>`;
}
function renderPrices() {
  let html = GROUPS.map(g => card(g.t, `<div class="grid sm:grid-cols-2 gap-4">${g.f.map(([k, l, u]) =>
    `<label class="block"><span class="block text-xs text-slate-400 mb-1.5">${l} <span class="text-slate-600">(${u})</span></span>${inp(k, rules[k])}</label>`).join('')}</div>`)).join('');
  const floorRow = (k, t) => `<tr><td class="py-2 pr-3 text-sm text-slate-300 whitespace-nowrap">${t}</td>${rules[k].map((v, i) => `<td class="p-1">${inp(k + '.' + i, v, 1)}</td>`).join('')}</tr>`;
  html += card('Dodatak za sprat (%)', `<div class="overflow-x-auto"><table class="w-full min-w-[560px]"><thead><tr><th></th>${FLOOR_NAMES.map(f => `<th class="text-[11px] text-slate-500 font-bold pb-1">${f}</th>`).join('')}</tr></thead><tbody>${floorRow('sprat_bez_lifta', 'Bez lifta')}${floorRow('sprat_sa_liftom', 'Sa liftom')}</tbody></table></div>`,
    'Procenat na ceo iznos selidbe. Računa se posebno za utovar i za istovar i sabira se. Za 7. sprat i više bez lifta kalkulator traži poziv.');
  html += card('Teški predmeti', `<div class="space-y-3">${Object.keys(rules.teski).map(k => `<div class="grid grid-cols-[1fr_8rem_8rem] gap-3 items-center"><span class="text-sm text-slate-300">${HEAVY_NAMES[k] || k}</span>${inp('teski.' + k + '.0', rules.teski[k][0])}${inp('teski.' + k + '.1', rules.teski[k][1])}</div>`).join('')}</div>`,
    'Prva kolona: osnovna cena po komadu. Druga: dodatak po spratu bez lifta.');
  html += card('Montaža i demontaža (po komadu)', `<div class="grid grid-cols-[1fr_7rem_7rem] gap-x-3 gap-y-2 items-center"><span></span><span class="text-[11px] text-slate-500 font-bold">Montaža</span><span class="text-[11px] text-slate-500 font-bold">Demontaža</span>${Object.keys(rules.montaza).map(k => `<span class="text-sm text-slate-300">${MD_NAMES[k] || k}</span>${inp('montaza.' + k + '.0', rules.montaza[k][0])}${inp('montaza.' + k + '.1', rules.montaza[k][1])}`).join('')}</div>`);
  $('#priceForm').innerHTML = html;
}
function readForm() {
  const r = clone(rules);
  for (const el of $$('#priceForm [data-path]')) {
    const v = Number(el.value);
    if (el.value === '' || !Number.isFinite(v) || v < 0) { el.focus(); throw new Error('Neispravan broj u polju.'); }
    const p = el.dataset.path.split('.');
    let o = r; for (let i = 0; i < p.length - 1; i++) o = o[p[i]];
    o[p[p.length - 1]] = v;
  }
  if (r.zaokruzi < 1) r.zaokruzi = 1;
  return r;
}
$('#priceForm').addEventListener('input', e => { if (e.target.dataset.path) e.target.classList.add('changed'); });
$('#savePrices').addEventListener('click', async () => {
  let r;
  try { r = readForm(); } catch (e) { toast(e.message); return; }
  const payload = { pravila: r };
  const cols = configRow ? Object.keys(configRow) : [];
  Object.entries(MIRROR).forEach(([k, names]) => names.forEach(n => { if (cols.includes(n)) payload[n] = r[k]; }));
  if (cols.includes('dodatak_za_sprat')) payload.dodatak_za_sprat = r.sprat_bez_lifta[1];
  if (cols.includes('floor_price')) payload.floor_price = r.sprat_bez_lifta[1];
  if (cols.includes('updated_at')) payload.updated_at = new Date().toISOString();
  const btn = $('#savePrices'); btn.disabled = true;
  const res = configRow
    ? await db.from('config').update(payload).eq('id', configRow.id).select()
    : await db.from('config').insert(Object.assign({ id: 1 }, payload)).select();
  btn.disabled = false;
  if (res.error || !res.data || !res.data.length) { toast('Nije sačuvano' + (res.error ? ': ' + res.error.message : ' (nema dozvolu).')); return; }
  configRow = res.data[0]; rules = r; renderPrices();
  toast('Cene su sačuvane i važe na sajtu.');
});
$('#resetPrices').addEventListener('click', () => {
  if (!confirm('Vratiti sve cene na početne vrednosti? (Postaje važeće tek kad kliknete Sačuvaj.)')) return;
  rules = clone(DEFAULT_RULES); renderPrices(); $$('#priceForm .num').forEach(x => x.classList.add('changed'));
});
$$('.tab-btn[data-tab]').forEach(b => b.addEventListener('click', () => {
  $$('.tab-btn[data-tab]').forEach(x => x.classList.toggle('active', x === b));
  $('#tab-leads').hidden = b.dataset.tab !== 'leads';
  $('#tab-prices').hidden = b.dataset.tab !== 'prices';
}));
db.auth.getSession().then(({ data }) => enter(data.session));
})();
</script>
